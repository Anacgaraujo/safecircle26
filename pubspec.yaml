name: safecircle
description: "SafeCircle: personal safety and live location sharing for your trusted circle."
publish_to: 'none'

version: 83.0.2+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^8.2.1
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  geolocator: 13.0.2
  geocoding: ^4.0.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.0
  flutter_contacts: ^1.1.9+2
  permission_handler: ^12.0.3
  package_info_plus: ^9.0.1
  battery_plus: ^6.2.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  crypto: ^3.0.7
  characters: ^1.4.1
  web: ^1.1.1
  flutter_background_service: ^5.1.0
  flutter_riverpod: ^3.4.3
  cloud_functions: ^6.5.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  firebase_messaging: ^16.7.1
  share_plus: ^12.0.2
  purchases_flutter: ^11.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.4.0
  mocktail: ^1.0.5

flutter_launcher_icons:
  image_path: "assets/icon/icon-1024.png"
  android: true
  adaptive_icon_background: "#F8F6F7"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon-1024.png"
    background_color: "#F8F6F7"
    theme_color: "#EC13A4"

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: FeatherIcons
      fonts:
        - asset: assets/fonts/feather.ttf

