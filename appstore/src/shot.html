<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Poppins:wght@600;700;800&family=Roboto+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;overflow:hidden;-webkit-font-smoothing:antialiased}
  #c{position:relative;overflow:hidden}
  h1{margin:0;font-family:Poppins;font-weight:700;color:#fff;letter-spacing:-.02em}
  h1 em{font-style:normal}
  .sub{font-family:Manrope;font-weight:600;color:rgba(255,255,255,.86)}
</style>
<script src="kit.js"></script>
</head><body><div id="c"></div>
<script>
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 440, H = +q.get('h') || 956;
const ipad = q.get('device') === 'ipad';
const BG = {
  magenta: ['linear-gradient(165deg,#F43BB0 0%,#EC13A4 38%,#B80A80 100%)', '#FFE0F4'],
  purple: ['linear-gradient(165deg,#5634B0 0%,#37207B 48%,#211152 100%)', '#FF8AD8'],
  red: ['linear-gradient(165deg,#FF5A84 0%,#E41B68 50%,#B3124F 100%)', '#FFE3EC'],
  ink: ['linear-gradient(165deg,#3A2233 0%,#181116 60%,#0E0A0D 100%)', '#FF5CC8'],
};
const SMS = 'SafeCircle EMERGENCY: Jess Rivera pressed SOS at 11:42 PM and needs help. Location: Valencia St &amp; 21st St maps.google.com/?q=37.75650,-122.42110 Call Jess: (415) 555-0142';
const SHOTS = {
  1: { bg: 'magenta', title: 'Know they got<br>home <em>safe.</em>', sub: 'Your whole circle, live on one map.', screen: 'map',
       over: () => notif('SafeCircle', 'Maya arrived at Home', 'now'), ox: -0.04, oy: -0.045 },
  2: { bg: 'purple', title: 'Miss a check-in?<br><em>They’ll know.</em>', sub: 'Plan a journey. Confirm you’re safe with your PIN.', screen: 'journey',
       over: () => notif('SafeCircle', 'Check-in due — are you safe? Confirm within 5 min.', 'now'), ox: 0.5, oy: -0.045, center: true },
  3: { bg: 'red', title: 'One hold.<br><em>Help is on the way.</em>', sub: 'SOS sends your live location to the people you trust.', screen: 'sos',
       over: () => pill('check', 'Texted Mom, Alex &amp; Sam', '#fff', '#181116', '#10B981'), ox: 0.5, oy: -0.03, center: true },
  4: { bg: 'ink', title: 'A secret PIN that<br><em>silently</em> gets help.', sub: 'The screen looks normal. Your circle is alerted.', screen: 'pin',
       over: () => pill('eye-off', 'Panic PIN · silent alert sent', '#fff', '#181116', '#EC13A4'), ox: 0.5, oy: 0.435, center: true, opts: { n: 4, pressed: '9' } },
  5: { bg: 'magenta', title: 'Get a ping when<br>they <em>arrive.</em>', sub: 'Alerts when someone gets home, to school or work.', screen: 'places',
       over: () => notif('SafeCircle', 'Leo arrived at School', '3:02 PM'), ox: -0.04, oy: -0.045 },
  6: { bg: 'purple', title: 'Alerts reach people<br><em>without the app.</em>', sub: 'Emergency contacts get a text with your location.', screen: 'sent',
       over: () => smsBubble(SMS), ox: 0.5, oy: 0.47, center: true },
};
const s = SHOTS[q.get('shot') || 1];
const bg = BG[s.bg];

// device geometry
const dev = ipad ? { sw: 600, sh: 864, bez: 16, r: 38, ir: 22 } : { sw: 393, sh: 852, bez: 12, r: 62, ir: 50 };
const fw = dev.sw + dev.bez * 2, fh = dev.sh + dev.bez * 2;
const titleSize = ipad ? 60 : (W / 440) * 38;
const subSize = ipad ? 24 : (W / 440) * 16.5;
const phoneTop = ipad ? 290 : H * 0.262;
const scale = ipad ? (H - phoneTop + 30) / fh : Math.min((W * 0.76) / fw, (H - phoneTop + 6) / fh);
const left = (W - fw * scale) / 2;

const screenOpts = { ...(s.opts || {}) };
const screenHtml = `<div style="position:relative;width:${dev.sw}px;height:${dev.sh}px;overflow:hidden;background:#F8F6F7;border-radius:${dev.ir}px">
  ${SCREENS[s.screen]({ ...screenOpts, w: dev.sw, h: dev.sh })}${statusBar()}${ipad ? '' : island}${homeBar()}</div>`;

const rings = [0.55, 0.85, 1.15, 1.45].map((k, i) => `<div style="position:absolute;left:50%;top:${phoneTop + fh * scale * 0.42}px;width:${W * k * 1.25}px;height:${W * k * 1.25}px;margin-left:${-W * k * 0.625}px;margin-top:${-W * k * 0.625}px;border-radius:50%;border:${ipad ? 2 : 1.2}px solid rgba(255,255,255,${0.16 - i * 0.03})"></div>`).join('');

const overScale = ipad ? 1.45 : W / 440;
if (ipad && s.oy < 0) { s.oy = 0.035; if (!s.center) s.ox = 0.1; }
const overHtml = s.over ? `<div style="position:absolute;left:${s.center ? W * s.ox : W * s.ox + 12}px;top:${phoneTop + fh * scale * s.oy}px;transform:${s.center ? 'translateX(-50%) ' : ''}scale(${overScale});transform-origin:${s.center ? '50% 0' : '0 0'};z-index:10">${s.over()}</div>` : '';

document.getElementById('c').style.cssText += `width:${W}px;height:${H}px;background:${bg[0]}`;
document.getElementById('c').innerHTML = `
  <div style="position:absolute;inset:0;background:radial-gradient(70% 45% at 85% 8%,rgba(255,255,255,.18),transparent 70%)"></div>
  ${rings}
  <div style="position:absolute;left:0;right:0;top:${ipad ? 92 : H * 0.062}px;text-align:center;padding:0 ${ipad ? 80 : 24}px">
    <h1 style="font-size:${titleSize}px;line-height:1.1">${s.title.replace('<em>', `<em style="color:${bg[1]}">`)}</h1>
    <div class="sub" style="font-size:${subSize}px;margin-top:${ipad ? 18 : 12}px;line-height:1.35">${s.sub}</div>
  </div>
  <div style="position:absolute;left:${left}px;top:${phoneTop}px;width:${fw}px;height:${fh}px;transform:scale(${scale});transform-origin:0 0">
    <div style="position:absolute;inset:0;border-radius:${dev.r}px;background:#0B0B0D;box-shadow:0 0 0 2px #3a3a3e inset,0 40px 80px -20px rgba(0,0,0,.55)"></div>
    <div style="position:absolute;left:${dev.bez}px;top:${dev.bez}px">${screenHtml}</div>
  </div>
  ${overHtml}`;
document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script></body></html>
