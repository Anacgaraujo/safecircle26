<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Poppins:wght@600;700;800&family=Roboto+Mono:wght@500;700&display=block" rel="stylesheet">
<style>html,body{margin:0;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}#v{position:relative;width:443px;height:960px;overflow:hidden}</style>
<script src="kit.js"></script></head><body><div id="v"></div>
<script>
// App Preview: 443 x 960 CSS px at DPR 2 = 886 x 1920. render(t) draws second t.
const DUR = 26;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const seg = (t, a, b) => ease((t - a) / (b - a));
const SC = 443 / 393;

function frame(inner) {
  return `<div style="position:absolute;left:0;top:0;width:393px;height:852px;transform:scale(${SC});transform-origin:0 0;overflow:hidden;background:#F8F6F7">${inner}${statusBar()}${island}${homeBar()}</div>`;
}
function caption(text, t, a, b) {
  const o = Math.min(seg(t, a, a + 0.4), 1 - seg(t, b - 0.4, b));
  if (o <= 0) return '';
  return `<div style="position:absolute;left:50%;bottom:${34 + (1 - o) * 10}px;transform:translateX(-50%);opacity:${o};background:rgba(24,17,22,.88);color:#fff;font:800 19px Manrope;padding:13px 22px;border-radius:99px;white-space:nowrap;z-index:90;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)">${text}</div>`;
}
function dropNotif(title, body, time, t, a, b) {
  const o = Math.min(seg(t, a, a + 0.45), 1 - seg(t, b - 0.35, b));
  if (o <= 0) return '';
  return `<div style="position:absolute;left:50%;top:${58 + (o - 1) * 70}px;transform:translateX(-50%);opacity:${o};z-index:95">${notif(title, body, time, 410)}</div>`;
}
function finger(x, y, t, a, b) {
  if (t < a || t > b) return '';
  const o = Math.min(seg(t, a, a + 0.12), 1 - seg(t, b - 0.12, b));
  return `<div style="position:absolute;left:${x * SC - 24}px;top:${y * SC - 24}px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(0,0,0,.18);opacity:${o};z-index:96"></div>`;
}

const SCENES = [
  { a: 0, b: 5.6, draw: (t) => {
      const slide = seg(t, 2.9, 3.6);
      return frame(screenMap({ slide, panX: slide * 40, panY: -slide * 18 }))
        + dropNotif('SafeCircle', 'Maya arrived at Home', 'now', t, 0.6, 2.6)
        + caption('Your circle, live on one map', t, 0.3, 5.3);
  } },
  { a: 5.6, b: 12.4, draw: (t) => {
      const l = t - 5.6;
      let body;
      if (l < 2.4) body = screenJourney({ due: true });
      else if (l < 4.9) {
        const n = clamp(Math.floor((l - 2.7) / 0.4) + 1, 0, 4);
        const keys = ['1', '9', '8', '4'];
        const kt = (l - 2.7) % 0.4;
        body = screenPin({ n, pressed: n > 0 && kt < 0.2 ? keys[n - 1] : null });
      } else body = screenJourney({ due: false, confirmed2: true });
      return frame(body) + finger(338, 432, l, 1.9, 2.35)
        + caption(l < 2.4 ? 'Check-in due? Confirm with your PIN' : l < 4.9 ? 'Only you know your PIN' : 'Confirmed. Your circle can relax.', t, l < 2.4 ? 5.8 : l < 4.9 ? 8.0 : 10.5, l < 2.4 ? 8.0 : l < 4.9 ? 10.5 : 12.2);
  } },
  { a: 12.4, b: 18.6, draw: (t) => {
      const l = t - 12.4;
      if (l < 2.7) {
        const p = seg(l, 0.7, 2.4) * (l > 0.7 ? 1 : 0);
        return frame(screenSos({ progress: l < 0.7 ? 0 : clamp((l - 0.7) / 1.6), haloT: (l * 0.62) % 1 }))
          + finger(232, 420, l, 0.6, 2.6) + caption('Hold SOS when you need help', t, 12.6, 15.0);
      }
      const k = l - 2.7;
      return frame(screenSent({ pop: 0.4 + 0.6 * seg(k, 0, 0.5), shown: clamp(Math.floor((k - 0.4) / 0.3) + 1, 0, 3) }))
        + caption('Circle & contacts alerted with your location', t, 15.3, 18.4);
  } },
  { a: 18.6, b: 22.4, draw: (t) => {
      const l = t - 18.6;
      return frame(screenPlaces({ show: clamp(Math.floor(l / 0.22) + 1, 0, 4) }))
        + dropNotif('SafeCircle', 'Leo arrived at School', '3:02 PM', t, 19.8, 22.2)
        + caption('Alerts when they arrive or leave', t, 18.8, 22.2);
  } },
  { a: 22.4, b: DUR, draw: (t) => {
      const l = t - 22.4;
      const o = seg(l, 0.2, 0.9), o2 = seg(l, 0.6, 1.3);
      return `<div style="position:absolute;inset:0;background:linear-gradient(165deg,#F43BB0 0%,#EC13A4 40%,#B80A80 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
        ${[300, 460, 620].map((d, i) => `<div style="position:absolute;left:50%;top:44%;width:${d * (0.9 + 0.1 * o)}px;height:${d * (0.9 + 0.1 * o)}px;transform:translate(-50%,-50%);border-radius:50%;border:1.5px solid rgba(255,255,255,${(0.2 - i * 0.05) * o})"></div>`).join('')}
        <img src="icon.png" style="width:128px;height:128px;border-radius:29px;box-shadow:0 20px 40px -12px rgba(0,0,0,.45);opacity:${o};transform:scale(${0.85 + 0.15 * o})">
        <div style="margin-top:26px;font:700 40px Poppins;color:#fff;letter-spacing:-.5px;opacity:${o}">SafeCircle</div>
        <div style="margin-top:14px;font:700 25px/1.25 Poppins;color:#FFE0F4;padding:0 40px;opacity:${o2};transform:translateY(${(1 - o2) * 10}px)">Someone always knows<br>you’re safe.</div>
      </div>`;
  } },
];

window.render = (t) => {
  let html = '';
  SCENES.forEach((s, i) => {
    const fadeIn = i === 0 ? 1 : seg(t, s.a - 0.15, s.a + 0.2);
    if (t >= s.a - 0.15 && t < s.b + 0.2) html += `<div style="position:absolute;inset:0;opacity:${fadeIn}">${s.draw(Math.max(t, s.a))}</div>`;
  });
  document.getElementById('v').innerHTML = html;
};
render(+new URLSearchParams(location.search).get('t') || 0);
document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script></body></html>
