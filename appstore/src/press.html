<script>
const SCALE_W = 393, SCALE_H = 852;
// iPhone frame around a recreated app screen; s = scale of the 417x876 device
const phone = (name, opts, s, extra = '') => `<div style="position:relative;width:${417 * s}px;height:${876 * s}px;flex:none;${extra}">
  <div style="position:absolute;left:0;top:0;width:417px;height:876px;transform:scale(${s});transform-origin:0 0">

// ---------------------------------------------------------------- page 1: cover

    <div style="margin-top:24px;display:flex;gap:10px;font:700 12px Manrope">${['Circles', 'Journeys & check-ins', 'Panic PIN', 'One-hold SOS'].map((t) => `<span style="background:rgba(255,255,255,.16);border-radius:99px;padding:7px 13px">${t}</span>`).join('')}</div>

// ---------------------------------------------------------------- page 2: the release
const circleCard = (emoji, name, who, ids, when) => `<div class="card" style="flex:1;background:#fff;box-shadow:0 0 0 1.5px #F1E6EE">
  <div style="font:700 15px Poppins;color:#1F1720">${emoji} ${name}</div>

  <div style="margin-top:8px;display:inline-flex;align-items:center;gap:6px;font:800 10px Manrope;color:#B80A80;background:#FDE7F5;border-radius:99px;padding:5px 10px">${ic('clock', 12, '#B80A80', 2.6)}${when}</div>
</div>`;
const release = `<div class="page"><div class="pad">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div class="eyebrow">For immediate release</div>
    <img src="icon.png" style="width:34px;height:34px;border-radius:8px">
  </div>
  <h2 style="margin-top:14px;font-size:28px">SafeCircle 3.0 puts you in charge of who watches over you, and for how long</h2>
  <div style="margin-top:10px;font:600 14px/1.5 Manrope;color:#6E626C">Create private circles, let them follow your journey only while it matters, and send help with a single hold, or a secret PIN.</div>
  <div style="height:2px;background:linear-gradient(90deg,#EC13A4,#37207B);border-radius:2px;margin:20px 0 18px;width:90px"></div>
  <div style="columns:2;column-gap:30px;font-size:12px">
    <p><b><span class="ph">[CITY]</span>, November 2026</b> — SafeCircle today launched version 3.0 of its personal-safety app for iPhone and iPad, rebuilt from the ground up around one simple idea: <b>safety should never cost you your privacy.</b></p>
    <p>Most location apps ask you to be visible to everyone, all the time. SafeCircle flips that. You create <b>circles</b>, small private groups like <i>Family</i>, <i>Roommates</i> or <i>Friday-night crew</i>, and only the people you invite, and who accept, can ever see you.</p>
    <p>Then you decide <b>for how long</b>. Heading home after a late shift or meeting someone new? Start a journey, pick <b>who's watching</b>, and set your check-ins. That circle follows you until you check out with your PIN. Want a break from sharing? Pause it any time. Because pausing needs your PIN too, nobody else can switch it off for you.</p>
    <p>If something goes wrong, SafeCircle acts fast. Miss a check-in and, after a short grace period, your circle is alerted with your last known location. Hold the SOS button and your emergency contacts get a text with a live-location link, even if they've never installed the app. And if someone forces you to unlock your phone, entering your <b>panic PIN</b> makes everything look normal while your circle is silently told you need help.</p>
    <div style="break-inside:avoid;margin:14px 0 14px;padding:16px 18px;border-left:4px solid #EC13A4;background:#FDF3FA;border-radius:0 14px 14px 0">
      <div style="font:600 14.5px/1.45 Poppins;color:#37207B">“Feeling safe shouldn't mean being watched by everyone, forever. With SafeCircle, you pick your people and you pick the moment, and when it's over, it's over.”</div>
      <div style="margin-top:8px;font:700 11px Manrope;color:#6E626C"><span class="ph">[Name]</span>, <span class="ph">[Title]</span>, SafeCircle</div>
    </div>
    <p>SafeCircle 3.0 is for students walking home, parents with teens, people on a first date, solo travelers, night-shift workers, and anyone who simply wants someone to know they made it.</p>
    <p><b>Availability.</b> SafeCircle 3.0 is available now as a free download on the App Store for iPhone and iPad, in English, Spanish, French, Portuguese, Hindi and Chinese.</p>
  </div>

    ${circleCard('🏡', 'Roommates', 'Watching tonight\'s walk home from the station, check-ins every 30 minutes.', ['maya', 'sam'], 'Just this journey')}
    ${circleCard('🌙', 'Night out', 'Alex follows the first date. When you check out with your PIN, it ends.', ['alex'], 'Until you check out')}
  </div>
</div>${foot('2')}</div>`;

const fact = (k, v) => `<div style="display:flex;padding:9px 0;border-bottom:1px solid #F1E6EE"><div style="width:150px;font:800 10.5px Manrope;color:#9A8F98;letter-spacing:.6px;text-transform:uppercase">${k}</div><div style="flex:1;font:700 12px Manrope;color:#1F1720">${v}</div></div>`;
const facts = `<div class="page">

</script></body></html>
